 <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatApp Messenger</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: #f5f7f6;
}
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 70px 24px;
}
.logo {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  color: #06c755;
}
.card {
  margin-top: 35px;
  background: white;
  padding: 28px 22px;
  border-radius: 20px;
  box-shadow: 0 8px 25px #0000000a;
}
h2 { text-align: center; }
input {
  width: 100%;
  padding: 15px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #06c755;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
.link {
  text-align: center;
  color: #06a548;
  margin-top: 20px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">ChatApp</div>
  <div class="card">
    <h2 id="title">ログイン</h2>
    <form id="authForm">
      <input id="email" type="email"
        placeholder="メールアドレス" required>
      <input id="password" type="password"
        placeholder="パスワード" required>
      <button id="submitButton" type="submit">
        ログイン
      </button>
    </form>
    <p id="message" role="status"></p>
    <div class="link" id="toggle">
      新規会員登録はこちら
    </div>
  </div>
</div>
<script>
let signup = false;
const title = document.getElementById("title");
const button = document.getElementById("submitButton");
const toggle = document.getElementById("toggle");
const message = document.getElementById("message");

toggle.onclick = () => {
  signup = !signup;
  title.textContent = signup ? "新規会員登録" : "ログイン";
  button.textContent = signup ? "登録する" : "ログイン";
  toggle.textContent = signup
    ? "ログインはこちら"
    : "新規会員登録はこちら";
  message.textContent = "";
};

document.getElementById("authForm").onsubmit = (e) => {
  e.preventDefault();
  message.textContent =
    "画面の準備ができました。認証機能は次に接続します。";
};
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xhbvexchwqqlsgntkrfl.supabase.co";
const SUPABASE_KEY = "sb_publishable_0D-jzoXVU_uhbu_uVtA40A_9QjxOVOo";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("authForm").onsubmit =
async (e) => {
  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();
  const password =
    document.getElementById("password").value;

  const isSignup =
    document.getElementById("title").textContent
      === "新規会員登録";

  const message =
    document.getElementById("message");
  const button =
    document.getElementById("submitButton");

  button.disabled = true;
  message.textContent = "処理中...";

  try {
    const result = isSignup
      ? await client.auth.signUp({
          email, password
        })
      : await client.auth.signInWithPassword({
          email, password
        });

    if (result.error) throw result.error;

    if (result.data.session) {
      showLoggedIn();
    } else {
      message.textContent =
        "確認メールを送信しました。メールを確認してください。";
    }
  } catch (error) {
    message.textContent =
      "認証に失敗しました: " + error.message;
  } finally {
    button.disabled = false;
  }
};

function showLoggedIn() {
  document.querySelector(".card").innerHTML = `
    <h2>ログイン成功！</h2>
    <p>ChatAppへようこそ</p>
    <button id="logoutButton">ログアウト</button>
  `;

  document.getElementById("logoutButton").onclick =
    async () => {
      await client.auth.signOut();
      location.reload();
    };
}

client.auth.getSession().then(({data}) => {
  if (data.session) showLoggedIn();
});
</script>
</body>
</html>
